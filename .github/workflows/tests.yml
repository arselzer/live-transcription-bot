name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/check_public_source.py
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tools tests build_backend.py _bootstrap.py
      - run: ruff format --check src tools tests build_backend.py _bootstrap.py
      - run: python tools/run_tests.py
      - run: python -m build --sdist --wheel
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir "$RUNNER_TEMP/from-sdist"
