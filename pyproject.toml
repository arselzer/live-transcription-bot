[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "live-transcription-bot"
version = "0.1.0"
description = "Evidence-preserving Zoom and Proton Meet transcription bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["build==1.6.1", "ruff==0.17.3"]
diarization = ["speechbrain", "scikit-learn", "torch", "numpy"]
research = ["numpy", "soundfile", "librosa"]
cpu = ["faster-whisper", "numpy"]

[project.scripts]
live-transcript = "live_transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["live_transcript*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.setuptools.package-data]
live_transcript = ["runtime/launch.sh", "runtime/guest-bootstrap.sh", "runtime/*.Dockerfile", "operator_ui/*"]
